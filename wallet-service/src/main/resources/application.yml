spring:
  application:
    name: wallet-service
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    # Defaults target the docker-compose Postgres. Override via env in prod.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}
    hikari:
      # Small pool: the correctness comes from the DB, not from app-side locks.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      pool-name: wallet-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  shutdown: graceful

# Auth: static bearer-token -> user map. Override in prod via WALLET_TOKENS
# Format: "token1:user1,token2:user2"
wallet:
  tokens: ${WALLET_TOKENS:tok_alice:alice,tok_bob:bob,tok_carol:carol}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: wallet-service
    distribution:
      # Publish latency percentiles (p50/p95/p99) for HTTP requests, so the
      # scrape carries p99 rather than only count/sum.
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.paytm.pml.wallet: INFO
